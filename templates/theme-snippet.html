<!-- Theme support for lesson pages. Paste all three parts into every new page.
     1. This CSS goes at the top of the page's <style> block. -->
<style>
  /* Theme: dark is the default; the toggle switches to light and remembers it. */
  :root, html[data-theme="dark"]{
    color-scheme:dark;
    --ink:#e8e4da; --muted:#a39e93; --rule:#3a3631; --bg:#171512;
    --accent:#d4907a; --accent-soft:#2a201c; --accent-line:rgba(212,144,122,.35);
    --good:#7fb89a; --bad:#d98a7a; --good-soft:#1d2e26; --bad-soft:#33221e;
    --code-bg:#221f1b; --surface:#1f1c18; --surface-2:#26221e; --stripe:#2a2622;
    --on-accent:#171512;
  }
  html[data-theme="light"]{
    color-scheme:light;
    --ink:#1a1a1a; --muted:#6b6b6b; --rule:#d9d4c9; --bg:#fbfaf6;
    --accent:#7a3b2e; --accent-soft:#f0e8e2; --accent-line:rgba(122,59,46,.3);
    --good:#2f6b4f; --bad:#9a3b2e; --good-soft:#e6f1ea; --bad-soft:#f6e6e2;
    --code-bg:#f4f1ea; --surface:#fff; --surface-2:#fcfbf8; --stripe:#f6f3ec;
    --on-accent:#fff;
  }
  .theme-toggle{
    position:fixed;top:.9rem;right:.9rem;z-index:10;
    width:2.3rem;height:2.3rem;border-radius:50%;border:1px solid var(--rule);
    background:var(--surface);color:var(--accent);font-size:1.05rem;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .theme-toggle:hover{border-color:var(--accent)}
</style>

<!-- 2. This goes inside <head>, before the stylesheet, so the page never flashes the wrong theme. -->
<script>
  (function(){var t;try{t=localStorage.getItem('theme')}catch(e){}
  document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')})();
</script>

<!-- 3. This goes right after <body>. -->
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch between dark and light theme">☾</button>
<script>
  (function(){var b=document.getElementById('themeToggle'),h=document.documentElement;
  function paint(){b.textContent=h.getAttribute('data-theme')==='dark'?'☀':'☾'}
  b.addEventListener('click',function(){var n=h.getAttribute('data-theme')==='dark'?'light':'dark';
    h.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(e){}paint()});
  paint()})();
</script>
